<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{PAGE_TITLE}} — JulGame SDL WASM</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0b0f1a;
      }
      #canvas {
        display: block;
        margin: 0 auto;
        image-rendering: pixelated;
      }
      #status {
        position: fixed;
        left: 8px;
        top: 8px;
        color: #e2e8f0;
        font: 12px/1.4 monospace;
        background: rgba(0, 0, 0, 0.45);
        padding: 4px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="status">Booting {{PAGE_TITLE}}…</div>
    <canvas id="canvas" width="{{CANVAS_WIDTH}}" height="{{CANVAS_HEIGHT}}"></canvas>
    <script type="module" src="/ts/main.ts"></script>
  </body>
</html>
